<div class="drawer-bot" data-drawer-bot data-state="closed" aria-hidden="true">
  <div class="drawer-bot__runner" data-bot-runner>
    <img data-bot-image
         src="{{ '/images/nox-bot/drawer/still.png' | relative_url }}"
         alt="" width="320" height="320" loading="eager" decoding="async">
  </div>
  <span hidden data-bot-expression="blink" data-src="{{ '/images/nox-bot/drawer/blink.webp' | relative_url }}" data-duration="750"></span>
  <span hidden data-bot-expression="wink" data-src="{{ '/images/nox-bot/drawer/wink.webp' | relative_url }}" data-duration="1150"></span>
  <span hidden data-bot-expression="curious" data-src="{{ '/images/nox-bot/drawer/curious.webp' | relative_url }}" data-duration="2150"></span>
  <span hidden data-bot-expression="alert" data-src="{{ '/images/nox-bot/drawer/alert.webp' | relative_url }}" data-duration="1550"></span>
  <span hidden data-bot-expression="rest" data-src="{{ '/images/nox-bot/drawer/rest.webp' | relative_url }}" data-duration="3150"></span>
</div>
